<section id="contact" class="section" aria-labelledby="contact-title">
  <div class="container">
    <h2 id="contact-title" class="section-title">Contact</h2>
    <p class="lead"><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p class="link-row">
      <a href="{{ site.links.linkedin }}">LinkedIn</a>
      <a href="{{ site.links.github }}">GitHub</a>
      <a href="{{ site.links.studio }}">Studio</a>
      <a href="{{ site.links.studio_linkedin }}">Studio LinkedIn</a>
      <a href="{{ site.cv | relative_url }}">Download CV</a>
    </p>
  </div>
</section>
